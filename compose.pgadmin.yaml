name: portal-inmobiliario-admin

services:
  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: pgadmin
    restart: always
    ports:
      - "127.0.0.1:5050:80"
    env_file:
      - .env.pgadmin.local
    environment:
      PGADMIN_CONFIG_PASSWORD_LENGTH_MIN: "5"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgadmin_data:
